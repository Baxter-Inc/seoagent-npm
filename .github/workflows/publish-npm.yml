name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    # `id-token: write` is required for npm Trusted Publishing — npm verifies
    # the GitHub OIDC token instead of an NPM_TOKEN. `contents: write` lets
    # @semantic-release/github create the GitHub release.
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    # Node.js 20 is deprecated on GitHub runners (forced to Node 24 on
    # 2026-06-02, removed 2026-09-16). semantic-release-action@v4 still
    # declares Node 20, so force all JS actions in this job to Node 24 —
    # the opt-in the deprecation notice recommends. setup-node pins Node 24
    # so the npm CLI used by @semantic-release/npm is >= 11.5.1, the
    # minimum that speaks Trusted Publishing.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          # No `registry-url` on purpose. Setting it makes setup-node force
          # token-auth: it writes `_authToken=${NODE_AUTH_TOKEN}` into .npmrc
          # and defaults NODE_AUTH_TOKEN to a placeholder when no secret is
          # passed — which then 401s on `npm whoami` and short-circuits the
          # OIDC handshake we actually want. Leaving it off lets npm 11.5.1+
          # discover the GitHub Actions OIDC environment and exchange a
          # short-lived publish token at `npm publish` time.
          node-version: 24
      - uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/npm
            @semantic-release/exec
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
